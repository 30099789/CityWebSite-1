<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img">
  <title>CityLink Initiatives</title>
  <desc>CityLink Initiatives logo — city skyline mark with wordmark</desc>

  <!-- Icon square -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#185FA5"/>

  <!-- City skyline buildings -->
  <rect x="10" y="40" width="7"  height="19" rx="1" fill="white" opacity="0.9"/>
  <rect x="19" y="33" width="9"  height="26" rx="1" fill="white" opacity="0.9"/>
  <rect x="30" y="27" width="11" height="32" rx="1" fill="white"/>
  <rect x="43" y="34" width="7"  height="25" rx="1" fill="white" opacity="0.9"/>
  <rect x="52" y="30" width="6"  height="29" rx="1" fill="white" opacity="0.9"/>

  <!-- Link arc underneath buildings -->
  <path d="M13 59 Q32 47 51 59" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="76" y="29" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#0C447C" letter-spacing="-0.5">City<tspan fill="#185FA5">Link</tspan></text>
  <text x="77" y="44" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="400" fill="#888780" letter-spacing="2.5">INITIATIVES</text>
  <text x="77" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="400" fill="#B4B2A9">Smart Community Portal</text>
</svg>
